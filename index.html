<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
 min-height:100vh;overflow-x:hidden;display:grid;place-items:center;padding:24px 14px;
 color:#fff;font-family:'Poppins',sans-serif;position:relative;
 background:
 radial-gradient(circle at 15% 20%,#ffb4c8aa 0 2px,transparent 3px),
 radial-gradient(circle at 80% 15%,#fff5d688 0 2px,transparent 3px),
 radial-gradient(circle at 75% 75%,#ffb4c888 0 3px,transparent 4px),
 linear-gradient(135deg,#35133f 0%,#762c62 45%,#c34f78 100%);
 background-size:130px 130px,170px 170px,210px 210px,cover;
}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;opacity:.24;background-image:repeating-linear-gradient(45deg,transparent 0 35px,#ffd7e51c 36px 38px)}
.glow{position:fixed;width:340px;height:340px;border-radius:50%;background:#ff8fb433;filter:blur(65px);pointer-events:none}
.one{top:-120px;left:-100px}.two{right:-130px;bottom:-120px;background:#ffc4a633}
.card{width:min(100%,490px);position:relative;z-index:2;text-align:center;padding:34px 22px 30px;border:1px solid #ffffff55;border-radius:30px;background:linear-gradient(145deg,#ffffff24,#ffffff0d);box-shadow:0 25px 80px #16051d77,inset 0 1px 0 #ffffff55;backdrop-filter:blur(12px)}
.tag{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#ffdce9;margin-bottom:15px}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(27px,7vw,38px);margin-bottom:12px}
.intro{font-size:14px;line-height:1.8;color:#ffeaf1;margin:0 auto 24px;max-width:330px}
.envelope-button{border:0;background:none;cursor:pointer;color:white;display:block;margin:0 auto;transition:transform .25s}
.envelope-button:hover{transform:translateY(-6px) scale(1.04)}
.envelope{font-size:105px;display:block;filter:drop-shadow(0 12px 15px #250b2c88);animation:float 2.4s ease-in-out infinite}
.tap{font-size:13px;letter-spacing:1px;margin-top:5px;color:#ffe2ec}
@keyframes float{50%{transform:translateY(-10px) rotate(-3deg)}}
#reveal{display:none;animation:appear .9s ease both}
@keyframes appear{from{opacity:0;transform:translateY(25px) scale(.96)}to{opacity:1;transform:none}}
.photo-frame{padding:8px;background:linear-gradient(135deg,#fff0f5,#ffb7ce,#fff4dc);border-radius:20px;box-shadow:0 12px 35px #1b071d88}
.photo-frame img{width:100%;display:block;border-radius:14px;object-fit:cover}
.big-heart{font-size:clamp(75px,22vw,115px);line-height:1.15;margin:12px 0 0;display:inline-block;filter:drop-shadow(0 8px 15px #ff2e7888);animation:heartBeat 1.15s ease-in-out infinite}
@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.love-text{font-weight:800;letter-spacing:3px;font-size:clamp(32px,9vw,52px);line-height:1.2;margin:2px 0 12px;background:linear-gradient(90deg,#fff8d8,#ffc1dc,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 5px 22px #ff9bb855}
.note{font-size:13px;color:#ffe7ef;line-height:1.8}
.again{margin-top:20px;padding:11px 20px;border:1px solid #ffffff88;border-radius:30px;background:#ffffff1c;color:white;font:500 12px 'Poppins';cursor:pointer}
.particle{position:fixed;bottom:-35px;z-index:1;pointer-events:none;animation:rise linear forwards;opacity:.85}
@keyframes rise{to{transform:translateY(-115vh) rotate(35deg);opacity:0}}
.hidden{display:none!important}
</style>
</head>

<script>
function openLetter(){
 document.getElementById('start').classList.add('hidden');
 document.getElementById('reveal').style.display='block';
 for(let i=0;i<18;i++)setTimeout(makeParticle,i*90);
}
function showStart(){
 document.getElementById('reveal').style.display='none';
 document.getElementById('start').classList.remove('hidden');
}
function makeParticle(){
 const p=document.createElement('span');p.className='particle';
 p.textContent=['💗','💕','❤️','✨'][Math.floor(Math.random()*4)];
 p.style.left=Math.random()*100+'vw';p.style.fontSize=(16+Math.random()*25)+'px';
 p.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(p);
 setTimeout(()=>p.remove(),8500);
}
setInterval(makeParticle,650);
